<body class="grid-bg min-h-screen">
<div id="hdr"></div>
<main class="relative max-w-6xl mx-auto px-4 py-8 md:py-10">
 <div class="glow w-[420px] h-[420px] -top-32 -left-32"></div>
 <div id="tabs" class="relative hidden md:flex flex-wrap gap-2 mb-8"></div>
 <nav class="relative text-sm muted mb-5"><a href="/" class="hover:text-[#2B5288]">Beranda</a> / <a href="/#layanan" class="hover:text-[#2B5288]">Layanan</a> / <span class="text-[#16233a]" id="bc"></span></nav>
 <div class="relative grid lg:grid-cols-[1fr_360px] gap-6 items-start">
  <div class="space-y-5 min-w-0">
   <div class="card p-5 md:p-6 flex gap-4 items-center"><div id="ic" class="ico w-16 h-16 md:w-20 md:h-20 shrink-0 object-cover"></div><div class="min-w-0"><h1 id="tt" class="text-2xl md:text-3xl font-extrabold"></h1><p id="ds" class="muted text-sm mt-1"></p></div></div>
   <div class="card p-5 md:p-6">
    <label id="lb" class="font-semibold text-sm block mb-2"></label>
    <div class="relative"><input id="num" class="inp pr-28" inputmode="numeric"><div id="op" class="absolute right-2 top-1/2 -translate-y-1/2"></div></div>
    <p id="hint" class="muted text-xs mt-2"></p>
    <div id="extra" class="mt-4"></div>
   </div>
   <div class="card p-5 md:p-6"><h2 class="font-bold mb-4" id="ph">Pilih nominal</h2><div id="opts" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div></div>
  </div>
  <aside class="card p-5 md:p-6 lg:sticky lg:top-24">
   <h2 class="font-bold">Ringkasan pesanan</h2>
   <div class="mt-4 space-y-3 text-sm">
    <div class="flex justify-between gap-3"><span class="muted">Layanan</span><span id="rL" class="text-right"></span></div>
    <div class="flex justify-between gap-3"><span class="muted">Nomor</span><span id="rN" class="text-right break-all">-</span></div>
    <div class="flex justify-between gap-3"><span class="muted">Produk</span><span id="rP" class="text-right">-</span></div>
    <div class="flex justify-between gap-3"><span class="muted">Harga</span><span id="rH">-</span></div>
    <div class="flex justify-between gap-3"><span class="muted">Biaya admin</span><span id="rA">Rp0</span></div>
    <div class="border-t border-[#d3ccc2] pt-3 flex justify-between"><span class="font-semibold">Total</span><span id="rT" class="fh text-xl font-extrabold or">Rp0</span></div>
   </div>
   <button id="go" class="btn w-full mt-5" disabled="">Lanjut Bayar →</button>
   <p class="muted text-xs mt-3 text-center">Harga contoh, dapat berubah.</p>
  </aside>
 </div>
</main>
<script>
const LS={};try{Object.assign(LS,{get:k=>localStorage[k],set:(k,v)=>localStorage[k]=v})}catch(e){}if(!LS.get){LS.get=()=>null;LS.set=()=>{}}
renderHeader(true);
const OPS=[['Telkomsel','#E4002B',['0811','0812','0813','0821','0822','0823','0851','0852','0853']],['Indosat','#FFC800',['0814','0815','0816','0855','0856','0857','0858']],['XL','#0058A9',['0817','0818','0819','0859','0877','0878']],['Axis','#7A2A90',['0831','0832','0833','0838']],['Tri','#E5007E',['0895','0896','0897','0898','0899']],['Smartfren','#E4006C',['0881','0882','0883','0884','0885','0886','0887','0888','0889']]];
const nom=a=>a.map(v=>({n:'Rp'+v.toLocaleString('id-ID'),p:v+1500}));
const D={
 pln:{t:'Token & Tagihan PLN',d:'Beli token listrik prabayar atau bayar tagihan pascabayar.',l:'ID Pelanggan / Nomor Meter',ph:'Contoh: 532110000123',h:'11–12 digit, tertera di kWh meter.',adm:2500,o:nom([20000,50000,100000,200000,500000,1000000]),min:11},
 pulsa:{t:'Pulsa',d:'Isi pulsa semua operator, masuk dalam hitungan detik.',l:'Nomor HP',ph:'08xxxxxxxxxx',h:'Operator terdeteksi otomatis dari awalan nomor.',adm:0,o:nom([5000,10000,25000,50000,100000,200000]),min:10,op:1},
 data:{t:'Paket Data',d:'Kuota internet untuk semua operator dengan harga hemat.',l:'Nomor HP',ph:'08xxxxxxxxxx',h:'Operator terdeteksi otomatis dari awalan nomor.',adm:0,o:[{n:'3 GB · 7 hari',p:15000},{n:'10 GB · 30 hari',p:45000},{n:'25 GB · 30 hari',p:75000},{n:'50 GB · 30 hari',p:110000},{n:'Unlimited · 30 hari',p:150000},{n:'1 GB · 1 hari',p:5000}],min:10,op:1},
 bpjs:{t:'BPJS Kesehatan',d:'Bayar iuran BPJS untuk Anda dan keluarga, 1 hingga 6 bulan.',l:'Nomor VA / No. Peserta',ph:'Contoh: 8888801234567890',h:'16 digit nomor virtual account keluarga.',adm:2500,o:[1,2,3,4,5,6].map(b=>({n:b+' bulan',p:b*42000})),min:13,pt:'Pilih jumlah bulan iuran'},
 pdam:{t:'PDAM',d:'Bayar tagihan air PDAM di berbagai wilayah Indonesia.',l:'ID Pelanggan PDAM',ph:'Contoh: 0012345678',h:'Lihat di struk/tagihan bulan lalu.',adm:2500,o:[{n:'Tagihan Okt 2026',p:87500},{n:'Tagihan Sep + Okt',p:171000}],min:6,pt:'Pilih tagihan',reg:1}};
const key=new URLSearchParams(location.search).get('s')||'pln',S=D[key]||D.pln,k=D[key]?key:'pln';
document.title=S.t+' – Rayoza Online';bc.textContent=S.t;tt.textContent=S.t;ds.textContent=S.d;lb.textContent=S.l;num.placeholder=S.ph;hint.textContent=S.h;rL.textContent=S.t;
ic.innerHTML=ICO[k];if(S.pt)ph.textContent=S.pt;
tabs.innerHTML=Object.entries(D).map(([i,v])=>`<a href="?s=${i}" class="chip flex items-center gap-2 ${i==k?'on':''}"><span class="ico w-6 h-6 !rounded-md">${ICO[i]}</span>${({pln:'PLN',pulsa:'Pulsa',data:'Paket Data',bpjs:'BPJS',pdam:'PDAM'})[i]}</a>`).join('');
if(S.reg)extra.innerHTML=`<label class="font-semibold text-sm block mb-2">Wilayah PDAM</label><select id="reg" class="inp"><option value="">Pilih wilayah</option>${['PDAM Kota Bandung','PAM Jaya (DKI Jakarta)','PDAM Surya Sembada Surabaya','PDAM Tirtanadi Medan','PDAM Kota Semarang','PDAM Tirta Pakuan Bogor'].map(r=>`<option>${r}</option>`).join('')}</select>`;
let sel=null;
opts.innerHTML=S.o.map((o,i)=>`<button class="opt" data-i="${i}"><div class="font-semibold text-sm">${o.n}</div><div class="or fh font-bold mt-1">${rp(o.p)}</div></button>`).join('');
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));b.classList.add('on');sel=S.o[b.dataset.i];upd()});
let opName='';
function upd(){const v=num.value.replace(/\D/g,'');num.value=v;
 if(S.op){const o=v.length>=4&&OPS.find(o=>o[2].includes(v.slice(0,4)));opName=o?o[0]:'';op.innerHTML=o?`<span class="logo-op" style="background:${o[1]};${o[0]=='Indosat'?'color:#111':''}">${o[0]}</span>`:''}
 rN.textContent=v||'-';rP.textContent=sel?sel.n+(opName?' ('+opName+')':''):'-';rH.textContent=sel?rp(sel.p):'-';rA.textContent=rp(S.adm);rT.textContent=rp((sel?sel.p:0)+(sel?S.adm:0));
 const r=document.getElementById('reg');go.disabled=!(sel&&v.length>=S.min&&(!S.op||opName)&&(!r||r.value));}
num.oninput=upd;const r=document.getElementById('reg');if(r)r.onchange=upd;upd();
go.onclick=()=>{LS.set('nxOrder',JSON.stringify({svc:S.t,k,num:num.value,prod:sel.n+(opName?' ('+opName+')':'')+(r?' · '+r.value:''),price:sel.p,adm:S.adm}));location.href='/bayar'};
</script>
